name: ci-tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: kashi
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # db/mock pulls in encoding/json/jsontext, on by default from 1.27
        go-version: '1.27.x'

    # The up migrations, in order, straight through psql (preinstalled on the
    # runner); the tests only need the schema, not migrate's bookkeeping.
    - name: Run migrations
      env:
        PGPASSWORD: secret
      run: |
        for f in db/migrations/*.up.sql; do
          psql -v ON_ERROR_STOP=1 -q -h localhost -p 5433 -U root -d kashi -f "$f"
        done

    # app.env is gitignored; the example has the CI database settings.
    - name: Config
      run: cp example.app.env app.env

    - name: Test
      run: go test -cover ./...

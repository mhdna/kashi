name: ci-tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: kashi
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install migrate
      run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@latest

    - name: Run migrations
      run: migrate -path ./db/migrations -database "postgresql://root:secret@localhost:5433/kashi?sslmode=disable" up

    # app.env is gitignored; the example has the CI database settings.
    - name: Config
      run: cp example.app.env app.env

    - name: Test
      run: go test -cover ./...

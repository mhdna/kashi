# Config for `air` (github.com/air-verse/air) — live-reload for `make dev`.
root = "."
tmp_dir = "tmp"

[build]
  # Same entrypoint as `make server` (`go run .`), built to a binary so air
  # can restart it on change.
  cmd = "go build -o ./tmp/kashi ."
  entrypoint = ["./tmp/kashi"]
  delay = 300
  include_ext = ["go", "env"]
  # Whitelist the server's own source trees instead of trying to exclude the
  # many sibling dirs in this repo (ui/, fake-api/, old-commerce/, doc/, …).
  include_dir = ["api", "cmd", "db", "gapi", "pb", "token", "util"]
  exclude_regex = ["_test\\.go"]
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[misc]
  clean_on_exit = true

syntax = "proto3";

import "google/protobuf/timestamp.proto";

package pb;

option go_package = "github.com/mhdna/kashi/pb";


message User {
	string name       = 1;
	string password   = 2;
	string email      = 3;
	bool activated  = 4;
    google.protobuf.Timestamp password_changed_at = 5;
    google.protobuf.Timestamp created_at = 6;
}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GB</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-muted: #6b6b6b;
    --border: #e0e0e0;
    --primary: #1565c0;
    --error: #b3261e;
    --success: #2e7d32;
  }
  /* light unless the server marks the page follow-system (an app setting) */
  :root { color-scheme: light; }
  :root.follow-system { color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root.follow-system {
      --bg: #000000;
      --surface: #000000;
      --text: #f2f2f2;
      --text-muted: #9a9a9a;
      --border: #2a2a2a;
      --primary: #42a5f5;
      --error: #f2b8b5;
      --success: #6fbf73;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app-icon {
    width: 96px;
    height: 96px;
    margin-bottom: 12px;
    color: var(--text);
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border-radius: 8px;
    padding: 24px 20px;
  }
  h1 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .meta {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin: 0 0 20px;
  }
  .bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin: 0 0 16px;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--success);
    transition: width 0.2s;
  }
  .item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .item.done { border-color: var(--success); }
  .head {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 0.9rem;
    font-weight: 500;
  }
  .price { color: var(--text-muted); font-weight: 400; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .thumb {
    width: 56px;
    height: 56px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .state {
    flex: 1;
    font-size: 0.82rem;
    color: var(--text-muted);
  }
  .state.ok { color: var(--success); }
  .state.err { color: var(--error); }
  button, .btn {
    display: inline-block;
    padding: 9px 14px;
    border: none;
    border-radius: 6px;
    background: var(--primary);
    color: #fff;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
  }
  .btn.ghost, button.ghost {
    background: transparent;
    color: var(--primary);
    border: 1px solid var(--border);
  }
  input[type="file"] { display: none; }
  .center { text-align: center; }
  .checkmark {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid var(--success);
    color: var(--success);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    margin: 4px auto 16px;
  }
  .error { color: var(--error); font-size: 0.82rem; }

  /* one plain look: centered, high on the screen, black/white only (red for errors) */
  :root { --primary: var(--text); --success: var(--text); }
  body { justify-content: flex-start; padding-top: 7vh; }
  .app-icon { width: 128px; height: 128px; margin-bottom: 4px; }
  .card { border: 0; text-align: center; }
  button, .btn { color: var(--bg); }
  .btn.ghost, button.ghost { color: var(--text); }
  .previews { justify-content: center; }
  input[type="file"], input[type=file] { text-align: center; }
  .item { text-align: center; }
  .item.done { border-color: var(--border); }
  .head { justify-content: center; }
  .row { justify-content: center; }
  .state { flex: 0 1 auto; }
  .state.ok { color: var(--text-muted); }
  .notice { min-height: 3.4rem; margin: 0 0 12px; visibility: hidden; }
  .notice.on { visibility: visible; }
  .notice b { display: block; font-size: 1.05rem; }
  .notice span { font-size: 0.85rem; color: var(--text-muted); }
  .code { font-size: 3rem; font-weight: 700; line-height: 1; margin: 8px 0 12px; }
  .next { border-width: 2px; border-color: var(--text); padding: 18px 12px; }
  .next .btn { font-size: 1.05rem; padding: 14px 22px; }
  .idle { color: var(--text-muted); font-size: 0.95rem; margin: 24px 0; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); margin-right: 6px; vertical-align: middle; }
  .dot.on { background: #2e7d32; }
  .dot.off { background: var(--error); }
  .link { font-size: 0.8rem; color: var(--text-muted); margin-top: 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <svg class="app-icon" role="img" aria-label="GB" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 336"><path fill="currentColor" transform="matrix(1 0 0 -1 0 336)" d="M89 245 c-84 -23 -67 -156 20 -156 43 0 70 28 70 72 l0 16 -36 0 -35 0 0 -13 1 -13 17 -1 17 0 0 -3 c0 -30 -46 -35 -64 -7 -29 46 27 103 62 62 4 -6 2 -7 16 7 l10 12 -7 7 c-17 16 -47 23 -71 17zM195 244 c-1 0 -1 -34 -1 -76 l0 -76 34 0 c38 0 43 1 53 6 31 17 27 67 -6 74 -5 0 -5 1 0 5 26 18 15 58 -16 66 -6 1 -63 3 -64 1z m52 -29 c16 -8 8 -29 -11 -30 l-7 0 0 16 0 17 7 0 c3 -1 9 -2 11 -3z m3 -61 c10 -2 14 -7 15 -15 3 -13 -6 -20 -26 -20 l-9 0 -1 18 0 18 7 0 c4 0 10 -1 14 -1z"/></svg>
  <div class="card">
    <div id="content" hidden>
      <h1>Unknown items</h1>
      <p class="meta"><span class="dot" id="dot"></span><span id="conn">Paired with the till</span><br>
        Keep this page open. <span dir="rtl" lang="ar">أبقِ هذه الصفحة مفتوحة</span></p>
      <div id="idle" class="idle">Waiting for an unknown item on the till…<br>
        <span dir="rtl" lang="ar">بانتظار قطعة غير معروف كودها على الصندوق</span></div>
      <div id="active" hidden>
        <div class="bar"><i id="bar"></i></div>
        <div id="list"></div>
      </div>
    </div>
    <div id="invalid" class="center" hidden>
      <div class="code">404</div>
      <p class="meta">This phone is no longer paired. Scan the till's code again.<br>
        <span dir="rtl" lang="ar">هذا الهاتف لم يعد مقترنًا. امسح رمز الصندوق من جديد</span></p>
    </div>
  </div>
<script>
(function () {
  // This page's own path (/unknown_pairs/<token>, or /api/unknown_pairs/
  // <token> behind the prod proxy). The till's current cart comes from its
  // /status; that cart's pictures go to its own /unknown_uploads/<token>.
  var base = location.pathname.replace(/\/+$/, '');
  var root = base.replace(/unknown_pairs\/[^\/]+$/, '');
  var uploadToken = '', slots = [], sig = null;
  // Keyed by upload token + slot ref, so a picture still sending for a cart
  // that just ended never lands on the next cart's unit.
  var local = {}, sending = {}, failed = {};
  var touched = false, lastPending = 0;
  // While the camera is open the page is not redrawn: the file input that
  // opened it has to still be there when the picture comes back.
  var picking = false;

  function key(slot) { return uploadToken + '/' + slot.slot_ref; }
  function uploads(token) { return root + 'unknown_uploads/' + token; }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function isDone(s) { return s.has_image || s.waived || !!sending[key(s)]; }

  function setConn(ok) {
    document.getElementById('dot').className = 'dot ' + (ok ? 'on' : 'off');
    document.getElementById('conn').textContent = ok ? 'Paired with the till' : 'Reconnecting…';
  }

  function pictureButton(slot, text, ghost) {
    var label = el('label', 'btn' + (ghost ? ' ghost' : ''), text);
    var input = el('input'); input.type = 'file'; input.accept = 'image/*'; input.setAttribute('capture', 'environment');
    input.addEventListener('click', function () { picking = true; });
    input.addEventListener('change', function () {
      picking = false;
      if (input.files[0]) take(slot, input.files[0]);
      else render();
    });
    label.appendChild(input);
    return label;
  }

  function render() {
    if (picking) return;
    var active = !!uploadToken && slots.length > 0;
    document.getElementById('idle').hidden = active;
    document.getElementById('active').hidden = !active;
    var list = document.getElementById('list');
    list.textContent = '';
    if (!active) return;
    var pictured = slots.filter(function (s) { return s.has_image; });
    // The first unit still needing a picture is the big one: one tap opens
    // the camera, and the next unit is ready while this one sends.
    var next = slots.filter(function (s) { return !isDone(s); })[0];
    slots.forEach(function (slot, i) {
      var k = key(slot);
      var card = el('div', 'item' + (slot === next ? ' next' : '') + (isDone(slot) ? ' done' : ''));
      var head = el('div', 'head');
      head.appendChild(el('span', '', '#' + (i + 1) + ' · ' + (slot.label || 'Unknown item')));
      head.appendChild(el('span', 'price', '$' + (slot.unit_price / 100).toFixed(2)));
      card.appendChild(head);

      var row = el('div', 'row');
      var src = local[k] || (slot.has_image ? uploads(uploadToken) + '/images/' + slot.image_id + '?w=160' : '');
      if (src) { var img = el('img', 'thumb'); img.src = src; img.alt = ''; row.appendChild(img); }
      var status = el('span', 'state');
      if (sending[k]) status.textContent = failed[k] ? 'No connection — will keep trying' : 'Sending…';
      else if (slot.has_image) { status.textContent = 'Sent'; status.className += ' ok'; }
      else if (slot.waived) { status.textContent = 'Allowed without a picture'; status.className += ' ok'; }
      else status.textContent = 'Needs a picture';
      row.appendChild(status);
      if (!sending[k]) row.appendChild(pictureButton(slot, slot.has_image ? 'Retake' : 'Take picture', slot.has_image));
      card.appendChild(row);

      // "Same as #N": the same item again shares that picture.
      var seen = {};
      var others = pictured.filter(function (o) {
        if (o.slot_ref === slot.slot_ref || seen[o.image_id]) return false;
        seen[o.image_id] = 1;
        return true;
      });
      if (others.length && !isDone(slot)) {
        var copies = el('div', 'row');
        copies.appendChild(el('span', 'state', 'Same as'));
        others.forEach(function (o) {
          var b = el('button', 'ghost', '#' + (slots.indexOf(o) + 1));
          b.type = 'button';
          b.addEventListener('click', function () { copyFrom(slot, o); });
          copies.appendChild(b);
        });
        card.appendChild(copies);
      }
      list.appendChild(card);
    });
    var doneCount = slots.filter(isDone).length;
    document.getElementById('bar').style.width = (100 * doneCount / slots.length) + '%';
  }

  // Shrinks a phone photo to ~900px JPEG before sending: tens of KB
  // instead of several MB, which is what makes the upload near-instant.
  function shrink(file) {
    if (!window.createImageBitmap) return Promise.resolve(file);
    return createImageBitmap(file, { imageOrientation: 'from-image' }).then(function (bmp) {
      var k = Math.min(1, 900 / Math.max(bmp.width, bmp.height));
      var c = document.createElement('canvas');
      c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return new Promise(function (res, rej) {
        c.toBlob(function (b) { b ? res(b) : rej(new Error('encode')); }, 'image/jpeg', 0.65);
      });
    }, function () { return file; });
  }

  // A picture is sent in the background and retried until it lands, so a
  // weak signal never costs a retake; the salesperson moves straight on.
  function take(slot, file) {
    var token = uploadToken, ref = slot.slot_ref, k = key(slot);
    local[k] = URL.createObjectURL(file);
    sending[k] = true; delete failed[k];
    render();
    shrink(file).then(function (blob) {
      var delay = 1000;
      function attempt() {
        var fd = new FormData();
        fd.append('image', blob, 'item.jpg');
        fetch(uploads(token) + '/slots/' + encodeURIComponent(ref) + '/image', { method: 'POST', body: fd })
          .then(function (r) {
            // The cart was paid or the unit taken out: nothing to send to.
            if (r.status === 404) return null;
            if (!r.ok) throw new Error('upload');
            return r.json();
          })
          .then(function (data) {
            delete sending[k]; delete failed[k];
            if (data && token === uploadToken) slots = data.slots || slots;
            render();
          })
          .catch(function () {
            failed[k] = true; render();
            setTimeout(attempt, delay);
            delay = Math.min(delay * 2, 15000);
          });
      }
      attempt();
    });
  }

  function copyFrom(slot, source) {
    var token = uploadToken, k = key(slot);
    sending[k] = true; render();
    fetch(uploads(token) + '/slots/' + encodeURIComponent(slot.slot_ref) + '/copy', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ from_slot_ref: source.slot_ref })
    }).then(function (r) {
      if (!r.ok) throw new Error('copy');
      return r.json().then(function (data) { if (token === uploadToken) slots = data.slots || slots; });
    }).catch(function () {}).then(function () { delete sending[k]; render(); });
  }

  // A new unit to photograph buzzes the phone (once the page has been
  // touched: browsers only let a page vibrate after that).
  function notifyNew() {
    var pending = slots.filter(function (s) { return !isDone(s); }).length;
    if (pending > lastPending && touched && navigator.vibrate) navigator.vibrate(200);
    lastPending = pending;
  }

  function showInvalid() {
    document.getElementById('content').hidden = true;
    document.getElementById('invalid').hidden = false;
  }

  // The poll is held by kashi until the till's cart changes, so a unit
  // rung up on the till shows here at once; a dropped call waits a moment.
  function poll() {
    var url = base + '/status' + (sig === null ? '' : '?since=' + encodeURIComponent(sig));
    fetch(url, { cache: 'no-store' }).then(function (r) {
      if (r.status === 404) { var e = new Error('gone'); e.gone = true; throw e; }
      if (!r.ok) throw new Error('status');
      return r.json();
    }).then(function (data) {
      uploadToken = data.upload_token || '';
      slots = data.slots || [];
      sig = data.sig;
      document.getElementById('content').hidden = false;
      setConn(true);
      render();
      notifyNew();
      poll();
    }).catch(function (e) {
      if (e.gone) { showInvalid(); return; }
      setConn(false);
      setTimeout(poll, 2000);
    });
  }

  // Keeps the screen on while the page is open, so it stays connected.
  var wakeLock = null;
  function keepAwake() {
    if (!navigator.wakeLock || wakeLock) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
      lock.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () {});
  }
  document.addEventListener('click', function () { touched = true; keepAwake(); }, true);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    keepAwake();
    // Back from the camera with no picture taken: draw what came meanwhile.
    setTimeout(function () { if (picking) { picking = false; render(); } }, 1500);
  });
  keepAwake();
  poll();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Upload transfer photo</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-muted: #6b6b6b;
    --border: #e0e0e0;
    --primary: #1565c0;
    --error: #b3261e;
    --success: #2e7d32;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --surface: #000000;
      --text: #f2f2f2;
      --text-muted: #9a9a9a;
      --border: #2a2a2a;
      --primary: #42a5f5;
      --error: #f2b8b5;
      --success: #6fbf73;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app-icon {
    width: 96px;
    height: 96px;
    margin-bottom: 12px;
    color: var(--text);
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px 20px;
  }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 2px; }
  .meta { color: var(--text-muted); font-size: 0.85rem; margin: 0 0 20px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-muted); }
  input[type=file] {
    width: 100%;
    padding: 10px;
    border: 1px dashed var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text);
  }
  .preview { margin-top: 12px; }
  .preview img { width: 100%; border-radius: 6px; border: 1px solid var(--border); }
  button {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 6px;
    background: var(--primary);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
  }
  button:disabled { opacity: 0.6; }
  .error { color: var(--error); font-size: 0.85rem; margin-top: 12px; }
  .center { text-align: center; }
  .checkmark { font-size: 3rem; color: var(--success); line-height: 1; }
  .alert-icon {
    font-size: 2rem; font-weight: 700; color: var(--error);
    border: 2px solid var(--error); border-radius: 50%;
    width: 56px; height: 56px; line-height: 52px; margin: 0 auto 12px;
  }
</style>
</head>
<body>
<svg class="app-icon" role="img" aria-label="GB" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 336"><path fill="currentColor" transform="matrix(1 0 0 -1 0 336)" d="M89 245 c-84 -23 -67 -156 20 -156 43 0 70 28 70 72 l0 16 -36 0 -35 0 0 -13 1 -13 17 -1 17 0 0 -3 c0 -30 -46 -35 -64 -7 -29 46 27 103 62 62 4 -6 2 -7 16 7 l10 12 -7 7 c-17 16 -47 23 -71 17zM195 244 c-1 0 -1 -34 -1 -76 l0 -76 34 0 c38 0 43 1 53 6 31 17 27 67 -6 74 -5 0 -5 1 0 5 26 18 15 58 -16 66 -6 1 -63 3 -64 1z m52 -29 c16 -8 8 -29 -11 -30 l-7 0 0 16 0 17 7 0 c3 -1 9 -2 11 -3z m3 -61 c10 -2 14 -7 15 -15 3 -13 -6 -20 -26 -20 l-9 0 -1 18 0 18 7 0 c4 0 10 -1 14 -1z"/></svg>
<div class="card" id="card">
  <p class="meta">Loading…</p>
</div>

<script>
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var token = parts[parts.length - 1];
  // Sibling endpoints, resolved relative to however this page was reached:
  // '/transfer_uploads/<token>' on the central server (a transfer's
  // attachment is always uploaded straight to kashi -- there's no local
  // POS fallback server the way close-shift receipts have one).
  var base = location.pathname.replace(/\/+$/, '');
  var card = document.getElementById('card');

  function escapeHtml (s) {
    var div = document.createElement('div');
    div.textContent = s == null ? '' : s;
    return div.innerHTML;
  }

  function renderInvalid (message) {
    card.innerHTML =
      '<div class="center">' +
      '<div class="alert-icon">!</div>' +
      '<h1>Link not available</h1>' +
      '<p class="meta">' + escapeHtml(message) + '</p>' +
      '</div>';
  }

  function renderSuccess () {
    card.innerHTML =
      '<div class="center">' +
      '<div class="checkmark">&#10003;</div>' +
      '<h1>Uploaded</h1>' +
      '<p class="meta">You can close this page now.</p>' +
      '</div>';
  }

  function renderForm (info) {
    card.innerHTML =
      '<h1>Transfer photo</h1>' +
      '<p class="meta">' + escapeHtml(info.subtitle || '') + '</p>' +
      '<form id="form">' +
        '<div class="field">' +
        '<label>Take one photo of the items being transferred</label>' +
        '<input type="file" id="file" accept="image/*" capture="environment">' +
        '<div class="preview" id="preview"></div>' +
        '</div>' +
        '<button type="submit" id="submit">Upload</button>' +
        '<div class="error" id="error" style="display:none"></div>' +
      '</form>';

    var fileInput = document.getElementById('file');
    var preview = document.getElementById('preview');
    var errorBox = document.getElementById('error');
    var submitBtn = document.getElementById('submit');

    fileInput.addEventListener('change', function () {
      preview.innerHTML = '';
      errorBox.style.display = 'none';
      var file = fileInput.files[0];
      if (file) {
        var img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        preview.appendChild(img);
      }
    });

    // Downscale a large camera photo before upload -- a 3-5MB original is
  // needless here and makes the admin Storage grid crawl. Falls back to
  // the untouched file for formats a <canvas> can't take (HEIC), or when
  // re-encoding wouldn't actually be smaller.
  function downscale (file, maxDim, quality) {
    return new Promise(function (resolve) {
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) { resolve(file); return; }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) { resolve(file); return; }
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
        canvas.toBlob(function (blob) {
          resolve(blob && blob.size < file.size ? blob : file);
        }, 'image/jpeg', quality);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var file = fileInput.files[0];
      if (!file) {
        errorBox.textContent = 'Choose a photo first.';
        errorBox.style.display = 'block';
        return;
      }
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Uploading…';

      downscale(file, 1600, 0.85).then(function (payload) {
        var formData = new FormData();
        var name = payload === file ? (file.name || 'transfer') : 'transfer.jpg';
        formData.append('image', payload, name);
        return fetch(base + '/images', { method: 'POST', body: formData });
      })
        .then(function (resp) {
          if (!resp.ok) {
            return resp.json().then(function (body) {
              throw new Error(body.error || 'Upload failed');
            });
          }
          renderSuccess();
        })
        .catch(function (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Upload';
          errorBox.textContent = err.message;
          errorBox.style.display = 'block';
        });
    });
  }

  fetch(base + '/status')
    .then(function (resp) {
      if (!resp.ok) {
        return resp.json().then(function (body) {
          throw new Error(body.error || 'This link is no longer valid.');
        });
      }
      return resp.json();
    })
    .then(function (info) {
      if (info.used) {
        renderSuccess();
      } else {
        renderForm(info);
      }
    })
    .catch(function (err) {
      renderInvalid(err.message);
    });
})();
</script>
</body>
</html>

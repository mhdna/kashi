<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Upload receipt</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-muted: #6b6b6b;
    --border: #e0e0e0;
    --primary: #1565c0;
    --error: #b3261e;
    --success: #2e7d32;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --surface: #000000;
      --text: #f2f2f2;
      --text-muted: #9a9a9a;
      --border: #2a2a2a;
      --primary: #42a5f5;
      --error: #f2b8b5;
      --success: #6fbf73;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app-icon {
    width: 168px;
    height: 168px;
    margin-bottom: 16px;
  }
  /* Two pre-rendered variants (solid black / solid white letters on a
     transparent background -- see the build note above the img tags)
     swapped by theme, rather than a CSS filter -- inverting/darkening the
     source icon in-browser turned out unreliable: the source PNG is a
     fully-opaque rounded square with the letter shape encoded in
     grayscale, not alpha, so filters like invert()/brightness() darken or
     invert the whole square uniformly instead of isolating the letters. */
  .app-icon-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    .app-icon-light { display: none; }
    .app-icon-dark { display: block; }
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border-radius: 8px;
    padding: 24px 20px;
  }
  h1 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .meta {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin: 0 0 20px;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  input[type="file"] {
    display: block;
    width: 100%;
    font-size: 0.85rem;
    color: var(--text);
  }
  .previews { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .previews img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 6px;
    background: var(--primary);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    color: var(--error);
    font-size: 0.82rem;
    margin-top: 10px;
  }
  .center { text-align: center; }
  .checkmark {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid var(--success);
    color: var(--success);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    margin: 4px auto 16px;
  }
  .alert-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid var(--error);
    color: var(--error);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    margin: 4px auto 16px;
  }
</style>
</head>

  <div class="card" id="card">
    <div class="center meta">Loading…</div>
  </div>

<script>
(function () {
  var token = location.pathname.split('/').filter(Boolean).pop();
  var card = document.getElementById('card');
  var MAX_FILES = 3;

  function escapeHtml (s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function renderInvalid (message) {
    card.innerHTML =
      '<div class="center">' +
      '<div class="alert-icon">!</div>' +
      '<h1>Link not available</h1>' +
      '<p class="meta">' + escapeHtml(message) + '</p>' +
      '</div>';
  }

  function renderSuccess () {
    card.innerHTML =
      '<div class="center">' +
      '<div class="checkmark">&#10003;</div>' +
      '<h1>Uploaded</h1>' +
      '<p class="meta">You can close this page now.</p>' +
      '</div>';
  }

  function renderForm (info) {
    card.innerHTML =
      '<h1>' + escapeHtml(info.description || 'Expense receipt') + '</h1>' +
      '<p class="meta">' + escapeHtml(info.amount_label || '') + '</p>' +
      '<form id="form">' +
        '<div class="field">' +
        '<label>Add up to 3 photos (camera or gallery)</label>' +
        '<input type="file" id="files" accept="image/*" capture="environment" multiple>' +
        '<div class="previews" id="previews"></div>' +
        '</div>' +
        '<button type="submit" id="submit">Upload</button>' +
        '<div class="error" id="error" style="display:none"></div>' +
      '</form>';

    var filesInput = document.getElementById('files');
    var previews = document.getElementById('previews');
    var errorBox = document.getElementById('error');
    var submitBtn = document.getElementById('submit');

    filesInput.addEventListener('change', function () {
      previews.innerHTML = '';
      errorBox.style.display = 'none';
      var files = Array.prototype.slice.call(filesInput.files);
      if (files.length > MAX_FILES) {
        errorBox.textContent = 'Please choose at most ' + MAX_FILES + ' photos.';
        errorBox.style.display = 'block';
        filesInput.value = '';
        return;
      }
      files.forEach(function (file) {
        var img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        previews.appendChild(img);
      });
    });

    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var files = Array.prototype.slice.call(filesInput.files);
      if (files.length === 0) {
        errorBox.textContent = 'Choose at least one photo first.';
        errorBox.style.display = 'block';
        return;
      }
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Uploading…';

      var formData = new FormData();
      files.forEach(function (file) { formData.append('images', file); });

      fetch('/expense_uploads/' + token + '/images', { method: 'POST', body: formData })
        .then(function (resp) {
          if (!resp.ok) {
            return resp.json().then(function (body) {
              throw new Error(body.error || 'Upload failed');
            });
          }
          renderSuccess();
        })
        .catch(function (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Upload';
          errorBox.textContent = err.message;
          errorBox.style.display = 'block';
        });
    });
  }

  fetch('/expense_uploads/' + token + '/status')
    .then(function (resp) {
      if (!resp.ok) {
        return resp.json().then(function (body) {
          throw new Error(body.error || 'This link is no longer valid.');
        });
      }
      return resp.json();
    })
    .then(function (info) {
      if (info.used) {
        renderSuccess();
      } else {
        renderForm(info);
      }
    })
    .catch(function (err) {
      renderInvalid(err.message);
    });
})();
</script>
